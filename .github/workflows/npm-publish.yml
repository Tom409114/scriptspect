name: npm publish from immutable tag

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      intent-id:
        description: Durable release-intent check-run ID
        required: true
      tag:
        description: Exact immutable stable tag selected as this dispatch ref
        required: true
      sha:
        description: Exact 40-character commit resolved by the selected tag
        required: true

permissions:
  contents: read

concurrency:
  group: release-aliases-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify-action-tag:
    name: Consume the immutable Action tag checkout
    if: >-
      github.event_name == 'push' ||
      (github.ref == format('refs/tags/{0}', inputs.tag) && github.sha == inputs.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable-tag fixtures
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .ci/release-clean .ci/release-broken
          node -e "require('node:fs').writeFileSync('.ci/release-clean/package.json', JSON.stringify({name:'clean',scripts:{build:'node -e \\"process.exit(0)\\"'}}, null, 2))"
          node -e "require('node:fs').writeFileSync('.ci/release-broken/package.json', JSON.stringify({name:'broken',scripts:{clean:'rm -rf dist'}}, null, 2))"
      - name: Analyze broken fixture from the immutable tag
        id: broken
        uses: ./
        continue-on-error: true
        with:
          path: .ci/release-broken
      - name: Analyze clean fixture from the immutable tag
        id: clean
        uses: ./
        with:
          path: .ci/release-clean
      - name: Verify immutable-tag evidence
        if: always()
        env:
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_EXIT: ${{ steps.broken.outputs.exit-code }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit-code }}
        run: |
          test "$BROKEN_OUTCOME" = failure
          test "$BROKEN_EXIT" = 1
          test "$CLEAN_OUTCOME" = success
          test "$CLEAN_EXIT" = 0

  publish:
    name: Verify staged anchors and publish through tag-bound npm OIDC
    needs: [verify-action-tag]
    if: needs.verify-action-tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: release-state-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      checks: write
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      intent-id: ${{ steps.publish.outputs.intent-id }}
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
      sha: ${{ steps.publish.outputs.sha }}
      release-id: ${{ steps.publish.outputs.release-id }}
      registry-sri: ${{ steps.publish.outputs.registry-sri }}
      provenance-digest: ${{ steps.publish.outputs.provenance-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify exact tag event, CI, intent, fork boundary, draft, and assets before npm
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_INTENT_ID: ${{ inputs.intent-id }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_SHA: ${{ inputs.sha }}
          RELEASE_PR_ACTORS: ${{ vars.RELEASE_PR_ACTORS || 'github-actions[bot]' }}
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_USERCONFIG: /dev/null
        shell: bash
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF#refs/tags/}
          SHA=$GITHUB_SHA
          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          VERSION=${TAG#v}
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$DISPATCH_TAG" == "$TAG" ]]
            [[ "$DISPATCH_SHA" == "$SHA" ]]
            [[ "$DISPATCH_INTENT_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/tag-ref.json"
          jq -e --arg ref "refs/tags/$TAG" --arg sha "$SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
            "$RUNNER_TEMP/tag-ref.json" >/dev/null

          INTENT_ID=$DISPATCH_INTENT_ID
          for attempt in {1..60}; do
            if [[ -z "$INTENT_ID" ]]; then
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/commits/$SHA/check-runs?check_name=release-intent" \
                > "$RUNNER_TEMP/check-runs.json"
              COUNT=$(jq '[.check_runs[] | select(.name == "release-intent" and .conclusion == "success" and .app.slug == "github-actions")] | length' "$RUNNER_TEMP/check-runs.json")
              [[ "$COUNT" -le 1 ]]
              [[ "$COUNT" == 1 ]] && INTENT_ID=$(jq -er '.check_runs[0].id' "$RUNNER_TEMP/check-runs.json")
            fi
            if [[ -n "$INTENT_ID" ]]; then
              gh api -H 'Accept: application/vnd.github+json' \
                "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/intent-check.json"
              jq -er '.output.text | fromjson' "$RUNNER_TEMP/intent-check.json" > "$RUNNER_TEMP/release-state.json"
              STATE=$(jq -er '.state' "$RUNNER_TEMP/release-state.json")
              if [[ "$STATE" =~ ^(staged-draft|npm-published|npm-verified|alias-planned|aliases-verified|final-planned|consumed)$ ]]; then
                break
              fi
            fi
            sleep 10
          done
          [[ -n "$INTENT_ID" ]]
          [[ "$STATE" =~ ^(staged-draft|npm-published|npm-verified|alias-planned|aliases-verified|final-planned|consumed)$ ]]
          jq -e --arg sha "$SHA" --arg tag "$TAG" --arg version "$VERSION" '
            .intent.mergeCommitSha == $sha and .intent.tag == $tag and .intent.version == $version and
            .intent.releasePrHeadRepo == "Tom409114/scriptspect" and
            (.intent.releasePrHeadSha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/release-state.json" >/dev/null

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          node tools/release/release-state.mjs verify-ci \
            --runs "$RUNNER_TEMP/ci-runs.json" --sha "$SHA" --repository "$REPOSITORY" \
            --workflow CI --event push --branch main --selection newest \
            > "$RUNNER_TEMP/verified-ci.json"

          INTENT_PR=$(jq -er '.intent.prNumber' "$RUNNER_TEMP/release-state.json")
          HEAD_REPO=$(jq -er '.intent.releasePrHeadRepo' "$RUNNER_TEMP/release-state.json")
          HEAD_SHA=$(jq -er '.intent.releasePrHeadSha' "$RUNNER_TEMP/release-state.json")
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/commits/$SHA/pulls" > "$RUNNER_TEMP/associated-pulls.json"
          jq -e --argjson pr "$INTENT_PR" --arg sha "$SHA" --arg repository "$REPOSITORY" \
            --arg headRepo "$HEAD_REPO" --arg headSha "$HEAD_SHA" --arg actors "$RELEASE_PR_ACTORS" '
            ($actors | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $allowedActors |
            [.[] | select(
              .number == $pr and .merged_at != null and .merge_commit_sha == $sha and
              .base.ref == "main" and .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and .head.repo.fork == false and
              .head.repo.full_name == $headRepo and .head.sha == $headSha and
              (.user.login as $actor | ($allowedActors | index($actor)) != null) and
              (.head.ref | startswith("release-please--")) and
              (.title | test("^chore\\(main\\): release "))
            )] | length == 1
          ' "$RUNNER_TEMP/associated-pulls.json" >/dev/null

          mkdir -p "$RUNNER_TEMP/release"
          for pattern in "scriptspect-$VERSION.tgz" SHA256SUMS candidate-manifest.json release-manifest.json; do
            gh release download "$TAG" --repo "$REPOSITORY" \
              --dir "$RUNNER_TEMP/release" --pattern "$pattern"
          done
          (cd "$RUNNER_TEMP/release" && sha256sum --check SHA256SUMS)
          TARBALL="scriptspect-$VERSION.tgz"
          tar -xOf "$RUNNER_TEMP/release/$TARBALL" package/package.json | \
            jq -e '.repository == {type:"git",url:"git+https://github.com/Tom409114/scriptspect.git"}' >/dev/null
          node tools/release/release-state.mjs validate-candidate \
            "$RUNNER_TEMP/release/candidate-manifest.json" >/dev/null
          node tools/release/release-state.mjs validate-release \
            "$RUNNER_TEMP/release/release-manifest.json" \
            "$RUNNER_TEMP/release/candidate-manifest.json" >/dev/null
          RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$TAG")
          RELEASE_ID=$(jq -er '.id' <<< "$RELEASE_JSON")
          RELEASE_DRAFT=$(jq -r '.draft | if type == "boolean" then tostring else error("draft is not boolean") end' <<< "$RELEASE_JSON")
          ACTUAL_RELEASE_ASSET_COUNT=$(jq '.assets | length' <<< "$RELEASE_JSON")
          [[ "$ACTUAL_RELEASE_ASSET_COUNT" -ge 4 && "$ACTUAL_RELEASE_ASSET_COUNT" -le 5 ]]
          jq '[
            .assets[] |
            {name,assetId:.id,sha256:(.digest | sub("^sha256:"; ""))}
          ] | sort_by(.name)' <<< "$RELEASE_JSON" > "$RUNNER_TEMP/observed-assets.json"
          jq -n --slurpfile state "$RUNNER_TEMP/release-state.json" \
            --slurpfile candidate "$RUNNER_TEMP/release/candidate-manifest.json" \
            --slurpfile release "$RUNNER_TEMP/release/release-manifest.json" \
            --slurpfile assets "$RUNNER_TEMP/observed-assets.json" \
            --arg tag "$TAG" --arg commit "$SHA" --argjson releaseId "$RELEASE_ID" \
            --argjson releaseDraft "$RELEASE_DRAFT" \
            '{state:$state[0],candidate:$candidate[0],release:$release[0],observed:{
              tag:{name:$tag,commit:$commit},
              release:{releaseId:$releaseId,tag:$tag,commit:$commit,draft:$releaseDraft},assets:$assets[0]}}' \
            > "$RUNNER_TEMP/publish-anchors.json"
          node tools/release/release-state.mjs verify-publish-anchors \
            "$RUNNER_TEMP/publish-anchors.json" > "$RUNNER_TEMP/verified-anchors.json"
          CANDIDATE_SRI=$(jq -er '.npmSRI' "$RUNNER_TEMP/verified-anchors.json")
          INTEGRITY_CONTRACT=docs/release/npm-integrity-contract.json

          npm install --global npm@11.12.1
          node tools/release/fetch-npm-artifact.mjs probe \
            --package scriptspect --version "$VERSION" > "$RUNNER_TEMP/registry-probe.json"
          if [[ "$(jq -er '.status' "$RUNNER_TEMP/registry-probe.json")" == not-found ]]; then
            npm publish "$RUNNER_TEMP/release/$TARBALL" --provenance --access public
          fi
          mkdir -p "$RUNNER_TEMP/registry/install"
          node tools/release/fetch-npm-artifact.mjs fetch \
            --package scriptspect --version "$VERSION" \
            --output "$RUNNER_TEMP/registry/registry.tgz" \
            --attempts 12 --base-delay-ms 5000 --max-delay-ms 30000 \
            --request-timeout-ms 15000 \
            > "$RUNNER_TEMP/registry-fetch.json"
          REGISTRY_SRI=$(jq -er '.registryNpmSRI' "$RUNNER_TEMP/registry-fetch.json")
          node tools/release/verify-package-integrity.mjs \
            --contract "$INTEGRITY_CONTRACT" \
            --candidate "$RUNNER_TEMP/release/$TARBALL" \
            --registry "$RUNNER_TEMP/registry/registry.tgz" \
            --candidate-sri "$CANDIDATE_SRI" \
            --registry-sri "$REGISTRY_SRI" \
            > "$RUNNER_TEMP/integrity-verification.json"
          jq -e '.candidateTree' "$RUNNER_TEMP/integrity-verification.json" \
            > "$RUNNER_TEMP/candidate-tree.json"
          jq -e '.registryTree' "$RUNNER_TEMP/integrity-verification.json" \
            > "$RUNNER_TEMP/registry-tree.json"
          REGISTRY_MANIFEST_DIGEST=$(node tools/release/release-state.mjs json-digest \
            "$RUNNER_TEMP/registry-tree.json" | jq -er '.digest')

          if [[ "$STATE" == staged-draft ]]; then
            jq -n --arg publishedVersion "$VERSION" --arg npmSRI "$CANDIDATE_SRI" \
              --argjson publishRunId "$GITHUB_RUN_ID" \
              '{to:"npm-published",payload:{publishedVersion:$publishedVersion,npmSRI:$npmSRI,publishRunId:$publishRunId}}' \
              > "$RUNNER_TEMP/published-transition.json"
          else
            jq '{to:"npm-published",payload:.npmPublished}' "$RUNNER_TEMP/release-state.json" \
              > "$RUNNER_TEMP/published-transition.json"
          fi
          node tools/release/release-state.mjs transition "$RUNNER_TEMP/release-state.json" \
            "$RUNNER_TEMP/published-transition.json" --out "$RUNNER_TEMP/published-state.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" > "$RUNNER_TEMP/latest-state.json"
          node tools/release/release-state.mjs compare-and-update \
            "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/published-state.json" \
            --out "$RUNNER_TEMP/approved-published-state.json" >/dev/null
          jq -n --rawfile text "$RUNNER_TEMP/approved-published-state.json" '{
            name:"release-intent",status:"completed",conclusion:"success",
            output:{title:"npm package published",summary:"Exact tag-bound publication is durable",text:$text}}
          ' > "$RUNNER_TEMP/update-check.json"
          gh api -X PATCH -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null

          mv "$RUNNER_TEMP/approved-published-state.json" "$RUNNER_TEMP/release-state.json"

          cd "$RUNNER_TEMP/registry/install"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-save "scriptspect@$VERSION" >/dev/null
          npm audit signatures --json --include-attestations > "$RUNNER_TEMP/registry/audit.json"
          cd "$GITHUB_WORKSPACE"
          node tools/release/verify-provenance.mjs \
            --audit "$RUNNER_TEMP/registry/audit.json" --package scriptspect --version "$VERSION" \
            --tarball "$RUNNER_TEMP/registry/registry.tgz" --repository "$REPOSITORY" \
            --workflow .github/workflows/npm-publish.yml --ref "refs/tags/$TAG" --sha "$SHA" \
            > "$RUNNER_TEMP/provenance.json"
          PROVENANCE_DIGEST=$(jq -er '.statementDigest' "$RUNNER_TEMP/provenance.json")

          jq -n --arg registryNpmSRI "$REGISTRY_SRI" \
            --arg registryManifestDigest "$REGISTRY_MANIFEST_DIGEST" \
            --arg provenanceDigest "$PROVENANCE_DIGEST" \
            '{to:"npm-verified",payload:{registryNpmSRI:$registryNpmSRI,
              registryManifestDigest:$registryManifestDigest,provenanceDigest:$provenanceDigest}}' \
            > "$RUNNER_TEMP/verified-transition.json"
          node tools/release/release-state.mjs transition "$RUNNER_TEMP/release-state.json" \
            "$RUNNER_TEMP/verified-transition.json" --out "$RUNNER_TEMP/verified-state.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" > "$RUNNER_TEMP/latest-state.json"
          node tools/release/release-state.mjs compare-and-update \
            "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/verified-state.json" \
            --out "$RUNNER_TEMP/approved-verified-state.json" >/dev/null
          jq -n --rawfile text "$RUNNER_TEMP/approved-verified-state.json" '{
            name:"release-intent",status:"completed",conclusion:"success",
            output:{title:"npm artifact and provenance verified",summary:"Registry integrity and tag-bound provenance are verified",text:$text}}
          ' > "$RUNNER_TEMP/update-check.json"
          gh api -X PATCH -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null

          {
            echo "intent-id=$INTENT_ID"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "release-id=$RELEASE_ID"
            echo "registry-sri=$REGISTRY_SRI"
            echo "provenance-digest=$PROVENANCE_DIGEST"
          } >> "$GITHUB_OUTPUT"

  advance-aliases:
    name: Publish the immutable-tag Release, persist the CAS plan, and move aliases
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-state-${{ github.repository }}-${{ needs.publish.outputs.sha }}
      cancel-in-progress: false
      queue: max
    permissions:
      checks: write
      contents: write
    outputs:
      minor-alias: ${{ steps.aliases.outputs.minor-alias }}
      major-alias: ${{ steps.aliases.outputs.major-alias }}
      old-minor: ${{ steps.aliases.outputs.old-minor }}
      old-major: ${{ steps.aliases.outputs.old-major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
      - name: Apply semver and ancestry guards, then update aliases by CAS
        id: aliases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INTENT_ID: ${{ needs.publish.outputs.intent-id }}
          SHA: ${{ needs.publish.outputs.sha }}
          VERSION: ${{ needs.publish.outputs.version }}
          TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_ID: ${{ needs.publish.outputs.release-id }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          MINOR_ALIAS="v$MAJOR.$MINOR"
          MAJOR_ALIAS="v$MAJOR"
          old_target() { git ls-remote --tags origin "refs/tags/$1" | awk '{print $1}'; }
          version_for_target() {
            local target=$1
            [[ -n "$target" ]] || return 0
            git ls-remote --tags origin | awk -v sha="$target" \
              '$1 == sha && $2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ {sub("refs/tags/v", "", $2); print $2}' | \
              sort -V | tail -n 1
          }
          ancestor_for_target() {
            local target=$1
            [[ -n "$target" ]] || { echo null; return; }
            [[ "$target" == "$SHA" ]] && { echo true; return; }
            if git merge-base --is-ancestor "$target" "$SHA"; then echo true; else echo false; fi
          }

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/intent-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/intent-check.json" \
            > "$RUNNER_TEMP/release-state.json"
          STATE=$(jq -er '.state' "$RUNNER_TEMP/release-state.json")
          jq -e --arg sha "$SHA" --arg tag "$TAG" --arg version "$VERSION" \
            --argjson releaseId "$RELEASE_ID" '
            (.state | IN("npm-verified","alias-planned","aliases-verified","final-planned","consumed")) and
            .intent.mergeCommitSha == $sha and .intent.tag == $tag and .intent.version == $version and
            .stagedDraft.releaseId == $releaseId
          ' "$RUNNER_TEMP/release-state.json" >/dev/null

          if [[ "$STATE" == npm-verified ]]; then
            OLD_MINOR=$(old_target "$MINOR_ALIAS")
            OLD_MAJOR=$(old_target "$MAJOR_ALIAS")
            CURRENT_MINOR_VERSION=$(version_for_target "$OLD_MINOR")
            CURRENT_MAJOR_VERSION=$(version_for_target "$OLD_MAJOR")
            MINOR_ANCESTOR=$(ancestor_for_target "$OLD_MINOR")
            MAJOR_ANCESTOR=$(ancestor_for_target "$OLD_MAJOR")
            jq -n --arg version "$VERSION" --arg commit "$SHA" \
              --arg minor "$MINOR_ALIAS" --arg major "$MAJOR_ALIAS" \
              --arg oldMinor "$OLD_MINOR" --arg oldMajor "$OLD_MAJOR" \
              --arg minorVersion "$CURRENT_MINOR_VERSION" --arg majorVersion "$CURRENT_MAJOR_VERSION" \
              --argjson minorAncestor "$MINOR_ANCESTOR" --argjson majorAncestor "$MAJOR_ANCESTOR" '
              {version:$version,commit:$commit,current:[
                {name:$minor,target:(if $oldMinor=="" then null else $oldMinor end),
                  version:(if $minorVersion=="" then null else $minorVersion end),ancestor:$minorAncestor},
                {name:$major,target:(if $oldMajor=="" then null else $oldMajor end),
                  version:(if $majorVersion=="" then null else $majorVersion end),ancestor:$majorAncestor}
              ]}' > "$RUNNER_TEMP/alias-plan-input.json"
            node tools/release/release-state.mjs semver-monotonic \
              "$RUNNER_TEMP/alias-plan-input.json" > "$RUNNER_TEMP/verified-alias-plan.json"
            jq -n --slurpfile plan "$RUNNER_TEMP/verified-alias-plan.json" \
              '{to:"alias-planned",payload:$plan[0]}' > "$RUNNER_TEMP/alias-plan-transition.json"
            node tools/release/release-state.mjs transition "$RUNNER_TEMP/release-state.json" \
              "$RUNNER_TEMP/alias-plan-transition.json" --out "$RUNNER_TEMP/planned-state.json" >/dev/null
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
            jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" \
              > "$RUNNER_TEMP/latest-state.json"
            node tools/release/release-state.mjs compare-and-update \
              "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/planned-state.json" \
              --out "$RUNNER_TEMP/approved-planned-state.json" >/dev/null
            jq -n --rawfile text "$RUNNER_TEMP/approved-planned-state.json" '{
              name:"release-intent",status:"completed",conclusion:"success",
              output:{title:"Alias CAS plan persisted",summary:"Previous targets are durable before mutation",text:$text}}
            ' > "$RUNNER_TEMP/update-check.json"
            gh api -X PATCH -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null
            mv "$RUNNER_TEMP/approved-planned-state.json" "$RUNNER_TEMP/release-state.json"
          else
            jq -e '.aliasPlan' "$RUNNER_TEMP/release-state.json" > "$RUNNER_TEMP/verified-alias-plan.json"
          fi

          preflight_alias() {
            local name=$1 previous current target
            previous=$(jq -r --arg name "$name" '.aliases[] | select(.name == $name) | .previousTarget // ""' \
              "$RUNNER_TEMP/verified-alias-plan.json")
            target=$(jq -r --arg name "$name" '.aliases[] | select(.name == $name) | .target' \
              "$RUNNER_TEMP/verified-alias-plan.json")
            [[ "$target" == "$SHA" ]]
            current=$(old_target "$name")
            [[ "$current" == "$target" ]] && return 0
            if [[ -z "$previous" ]]; then
              [[ -z "$current" ]]
            else
              [[ "$current" == "$previous" ]]
            fi
          }
          apply_alias() {
            local name=$1 previous current target
            previous=$(jq -r --arg name "$name" '.aliases[] | select(.name == $name) | .previousTarget // ""' \
              "$RUNNER_TEMP/verified-alias-plan.json")
            target=$(jq -r --arg name "$name" '.aliases[] | select(.name == $name) | .target' \
              "$RUNNER_TEMP/verified-alias-plan.json")
            current=$(old_target "$name")
            [[ "$current" == "$target" ]] && return 0
            git push origin "$target:refs/tags/$name" \
              --force-with-lease="refs/tags/$name:$previous"
          }
          preflight_alias "$MINOR_ALIAS"
          preflight_alias "$MAJOR_ALIAS"

          # Fail closed on any late Contents-write drift immediately before publication.
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/pre-public-release.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/pre-public-tag.json"
          jq '[
            .assets[] as $asset |
            {name:$asset.name,assetId:$asset.id,sha256:($asset.digest | sub("^sha256:"; ""))}
          ] | sort_by(.name)' "$RUNNER_TEMP/pre-public-release.json" \
            > "$RUNNER_TEMP/pre-public-assets.json"
          jq -n --slurpfile state "$RUNNER_TEMP/release-state.json" \
            --slurpfile release "$RUNNER_TEMP/pre-public-release.json" \
            --slurpfile tag "$RUNNER_TEMP/pre-public-tag.json" \
            --slurpfile assets "$RUNNER_TEMP/pre-public-assets.json" '
            {state:$state[0],observed:{releaseId:$release[0].id,tag:$release[0].tag_name,
              commit:$tag[0].object.sha,draft:$release[0].draft,assets:$assets[0]}}
          ' > "$RUNNER_TEMP/pre-public-release-input.json"
          node tools/release/release-state.mjs verify-release-snapshot \
            "$RUNNER_TEMP/pre-public-release-input.json" >/dev/null

          # Only a monotonic, conflict-free, exact-asset plan may make the Release public.
          PRE_PUBLIC_DRAFT=$(jq -r '.draft | if type == "boolean" then tostring else error("draft is not boolean") end' \
            "$RUNNER_TEMP/pre-public-release.json")
          if [[ "$PRE_PUBLIC_DRAFT" == true ]]; then
            gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --latest=false
          else
            [[ "$PRE_PUBLIC_DRAFT" == false ]]
          fi
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published-release.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/published-tag.json"
          jq '[
            .assets[] as $asset |
            {name:$asset.name,assetId:$asset.id,sha256:($asset.digest | sub("^sha256:"; ""))}
          ] | sort_by(.name)' "$RUNNER_TEMP/published-release.json" \
            > "$RUNNER_TEMP/published-assets.json"
          jq -n --slurpfile state "$RUNNER_TEMP/release-state.json" \
            --slurpfile release "$RUNNER_TEMP/published-release.json" \
            --slurpfile tag "$RUNNER_TEMP/published-tag.json" \
            --slurpfile assets "$RUNNER_TEMP/published-assets.json" '
            {state:$state[0],observed:{releaseId:$release[0].id,tag:$release[0].tag_name,
              commit:$tag[0].object.sha,draft:$release[0].draft,assets:$assets[0]}}
          ' > "$RUNNER_TEMP/published-release-input.json"
          node tools/release/release-state.mjs verify-published-release \
            "$RUNNER_TEMP/published-release-input.json" \
            > "$RUNNER_TEMP/verified-published-release.json"

          apply_alias "$MINOR_ALIAS"
          apply_alias "$MAJOR_ALIAS"
          [[ "$(old_target "$MINOR_ALIAS")" == "$SHA" ]]
          [[ "$(old_target "$MAJOR_ALIAS")" == "$SHA" ]]
          OUTPUT_OLD_MINOR=$(jq -r --arg name "$MINOR_ALIAS" \
            '.aliases[] | select(.name == $name) | .previousTarget // ""' \
            "$RUNNER_TEMP/verified-alias-plan.json")
          OUTPUT_OLD_MAJOR=$(jq -r --arg name "$MAJOR_ALIAS" \
            '.aliases[] | select(.name == $name) | .previousTarget // ""' \
            "$RUNNER_TEMP/verified-alias-plan.json")
          {
            echo "minor-alias=$MINOR_ALIAS"
            echo "major-alias=$MAJOR_ALIAS"
            echo "old-minor=$OUTPUT_OLD_MINOR"
            echo "old-major=$OUTPUT_OLD_MAJOR"
          } >> "$GITHUB_OUTPUT"

  record-verification:
    name: Durably record aliases and consume the release intent
    needs: [publish, advance-aliases]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release-state-${{ github.repository }}-${{ needs.publish.outputs.sha }}
      cancel-in-progress: false
      queue: max
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify aliases and attach idempotent final evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INTENT_ID: ${{ needs.publish.outputs.intent-id }}
          SHA: ${{ needs.publish.outputs.sha }}
          VERSION: ${{ needs.publish.outputs.version }}
          TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_ID: ${{ needs.publish.outputs.release-id }}
          REGISTRY_SRI: ${{ needs.publish.outputs.registry-sri }}
          PROVENANCE_DIGEST: ${{ needs.publish.outputs.provenance-digest }}
          MINOR_ALIAS: ${{ needs.advance-aliases.outputs.minor-alias }}
          MAJOR_ALIAS: ${{ needs.advance-aliases.outputs.major-alias }}
          OLD_MINOR: ${{ needs.advance-aliases.outputs.old-minor }}
          OLD_MAJOR: ${{ needs.advance-aliases.outputs.old-major }}
        shell: bash
        run: |
          set -euo pipefail
          alias_target() { git ls-remote --tags "https://github.com/$REPOSITORY.git" "refs/tags/$1" | awk '{print $1}'; }
          [[ "$(alias_target "$MINOR_ALIAS")" == "$SHA" ]]
          [[ "$(alias_target "$MAJOR_ALIAS")" == "$SHA" ]]
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/intent-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/intent-check.json" > "$RUNNER_TEMP/release-state.json"
          STATE=$(jq -er '.state' "$RUNNER_TEMP/release-state.json")
          if [[ "$STATE" == alias-planned ]]; then
            jq '{to:"aliases-verified",payload:{aliases:.aliasPlan.aliases}}' \
              "$RUNNER_TEMP/release-state.json" > "$RUNNER_TEMP/aliases-transition.json"
          else
            jq -e '.state | IN("aliases-verified","final-planned","consumed")' \
              "$RUNNER_TEMP/release-state.json" >/dev/null
            jq '{to:"aliases-verified",payload:.aliasesVerified}' "$RUNNER_TEMP/release-state.json" \
              > "$RUNNER_TEMP/aliases-transition.json"
          fi
          node tools/release/release-state.mjs transition "$RUNNER_TEMP/release-state.json" \
            "$RUNNER_TEMP/aliases-transition.json" --out "$RUNNER_TEMP/aliases-state.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" > "$RUNNER_TEMP/latest-state.json"
          node tools/release/release-state.mjs compare-and-update \
            "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/aliases-state.json" \
            --out "$RUNNER_TEMP/approved-aliases-state.json" >/dev/null
          jq -n --rawfile text "$RUNNER_TEMP/approved-aliases-state.json" '{
            name:"release-intent",status:"completed",conclusion:"success",
            output:{title:"Floating aliases verified",summary:"Global-lock semver and ancestry guards passed",text:$text}}
          ' > "$RUNNER_TEMP/update-check.json"
          gh api -X PATCH -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null

          jq -n --arg intentId "$(jq -er '.intent.intentId' "$RUNNER_TEMP/approved-aliases-state.json")" \
            --argjson releaseId "$RELEASE_ID" --arg commit "$SHA" --arg version "$VERSION" --arg tag "$TAG" \
            --arg candidateManifestDigest "$(jq -er '.retainedCandidate.candidateManifestDigest' "$RUNNER_TEMP/approved-aliases-state.json")" \
            --arg releaseManifestDigest "$(jq -er '.stagedDraft.releaseManifestDigest' "$RUNNER_TEMP/approved-aliases-state.json")" \
            --arg candidateNpmSRI "$(jq -er '.retainedCandidate.npmSRI' "$RUNNER_TEMP/approved-aliases-state.json")" \
            --arg registryNpmSRI "$REGISTRY_SRI" --arg provenanceDigest "$PROVENANCE_DIGEST" \
            --arg minor "$MINOR_ALIAS" --arg major "$MAJOR_ALIAS" '
            {schemaVersion:"scriptspect-final-verification/v1",intentId:$intentId,releaseId:$releaseId,
              commit:$commit,version:$version,tag:$tag,candidateManifestDigest:$candidateManifestDigest,
              releaseManifestDigest:$releaseManifestDigest,candidateNpmSRI:$candidateNpmSRI,
              registryNpmSRI:$registryNpmSRI,provenanceDigest:$provenanceDigest,
              aliases:[{name:$minor,target:$commit},{name:$major,target:$commit}]}
          ' > "$RUNNER_TEMP/final-verification.json"
          node tools/release/release-state.mjs canonicalize-json "$RUNNER_TEMP/final-verification.json" \
            --out "$RUNNER_TEMP/final-verification.json" >/dev/null
          FINAL_DIGEST=$(node tools/release/release-state.mjs json-digest \
            "$RUNNER_TEMP/final-verification.json" | jq -er '.digest')
          jq -n --arg finalVerificationDigest "$FINAL_DIGEST" \
            '{to:"final-planned",payload:{finalVerificationDigest:$finalVerificationDigest}}' \
            > "$RUNNER_TEMP/final-planned-transition.json"
          node tools/release/release-state.mjs transition "$RUNNER_TEMP/approved-aliases-state.json" \
            "$RUNNER_TEMP/final-planned-transition.json" \
            --out "$RUNNER_TEMP/final-planned-state.json" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" > "$RUNNER_TEMP/latest-state.json"
          node tools/release/release-state.mjs compare-and-update \
            "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/final-planned-state.json" \
            --out "$RUNNER_TEMP/approved-final-planned-state.json" >/dev/null
          jq -n --rawfile text "$RUNNER_TEMP/approved-final-planned-state.json" '{
            name:"release-intent",status:"completed",conclusion:"success",
            output:{title:"Final evidence planned",summary:"Final digest is durable before upload",text:$text}}
          ' > "$RUNNER_TEMP/update-check.json"
          gh api -X PATCH -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null

          RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$TAG")
          FINAL_COUNT=$(jq '[.assets[] | select(.name == "final-verification.json")] | length' <<< "$RELEASE_JSON")
          [[ "$FINAL_COUNT" -le 1 ]]
          if [[ "$FINAL_COUNT" == 1 ]]; then
            mkdir -p "$RUNNER_TEMP/existing-final"
            gh release download "$TAG" --repo "$REPOSITORY" --pattern final-verification.json \
              --dir "$RUNNER_TEMP/existing-final"
            jq -n --slurpfile existing "$RUNNER_TEMP/existing-final/final-verification.json" \
              --slurpfile proposed "$RUNNER_TEMP/final-verification.json" \
              '{existing:$existing[0],proposed:$proposed[0]}' > "$RUNNER_TEMP/final-idempotency.json"
          else
            jq -n --slurpfile proposed "$RUNNER_TEMP/final-verification.json" \
              '{existing:null,proposed:$proposed[0]}' > "$RUNNER_TEMP/final-idempotency.json"
          fi
          node tools/release/release-state.mjs final-idempotency \
            "$RUNNER_TEMP/final-idempotency.json" > "$RUNNER_TEMP/final-decision.json"
          if [[ "$(jq -er '.decision' "$RUNNER_TEMP/final-decision.json")" == write ]]; then
            gh release upload "$TAG" --repo "$REPOSITORY" "$RUNNER_TEMP/final-verification.json"
          fi

          for attempt in {1..12}; do
            RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/releases/tags/$TAG")
            FINAL_COUNT=$(jq '[.assets[] | select(.name == "final-verification.json")] | length' \
              <<< "$RELEASE_JSON")
            [[ "$FINAL_COUNT" -le 1 ]]
            FINAL_API_DIGEST=$(jq -r '[.assets[] | select(.name == "final-verification.json")] |
              if length == 1 then .[0].digest // "" else "" end' <<< "$RELEASE_JSON")
            [[ "$FINAL_COUNT" == 1 && "$FINAL_API_DIGEST" == "sha256:$FINAL_DIGEST" ]] && break
            sleep 5
          done
          [[ "$FINAL_COUNT" == 1 ]]
          [[ "$FINAL_API_DIGEST" == "sha256:$FINAL_DIGEST" ]]
          FINAL_ASSET_ID=$(jq -er '[.assets[] | select(.name == "final-verification.json")][0].id' \
            <<< "$RELEASE_JSON")
          mkdir -p "$RUNNER_TEMP/observed-final"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern final-verification.json \
            --dir "$RUNNER_TEMP/observed-final"
          [[ "$(sha256sum "$RUNNER_TEMP/observed-final/final-verification.json" | cut -d' ' -f1)" == "$FINAL_DIGEST" ]]

          jq -n --arg finalVerificationDigest "$FINAL_DIGEST" \
            --argjson finalVerificationAssetId "$FINAL_ASSET_ID" \
            '{to:"consumed",payload:{finalVerificationDigest:$finalVerificationDigest,
              finalVerificationAssetId:$finalVerificationAssetId}}' \
            > "$RUNNER_TEMP/consumed-transition.json"
          node tools/release/release-state.mjs transition "$RUNNER_TEMP/approved-final-planned-state.json" \
            "$RUNNER_TEMP/consumed-transition.json" --out "$RUNNER_TEMP/consumed-state.json" >/dev/null

          # Verify the complete proposed terminal state before making consumed durable.
          RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$TAG")
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/final-tag.json"
          printf '%s\n' "$RELEASE_JSON" > "$RUNNER_TEMP/final-release.json"
          jq '[
            .assets[] as $asset |
            {name:$asset.name,assetId:$asset.id,sha256:($asset.digest | sub("^sha256:"; ""))}
          ] | sort_by(.name)' <<< "$RELEASE_JSON" > "$RUNNER_TEMP/final-release-assets.json"
          jq -n --slurpfile state "$RUNNER_TEMP/consumed-state.json" \
            --slurpfile release "$RUNNER_TEMP/final-release.json" \
            --slurpfile tag "$RUNNER_TEMP/final-tag.json" \
            --slurpfile assets "$RUNNER_TEMP/final-release-assets.json" '
            {state:$state[0],observed:{releaseId:$release[0].id,tag:$release[0].tag_name,
              commit:$tag[0].object.sha,draft:$release[0].draft,assets:$assets[0]}}
          ' > "$RUNNER_TEMP/final-release-input.json"
          node tools/release/release-state.mjs verify-published-release \
            "$RUNNER_TEMP/final-release-input.json" >/dev/null
          [[ "$(alias_target "$MINOR_ALIAS")" == "$SHA" ]]
          [[ "$(alias_target "$MAJOR_ALIAS")" == "$SHA" ]]

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/latest-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/latest-check.json" > "$RUNNER_TEMP/latest-state.json"
          node tools/release/release-state.mjs compare-and-update \
            "$RUNNER_TEMP/latest-state.json" "$RUNNER_TEMP/consumed-state.json" \
            --out "$RUNNER_TEMP/approved-consumed-state.json" >/dev/null
          jq -n --rawfile text "$RUNNER_TEMP/approved-consumed-state.json" '{
            name:"release-intent",status:"completed",conclusion:"success",
            output:{title:"Consumed release intent",summary:"Final verification is exact and idempotent",text:$text}}
          ' > "$RUNNER_TEMP/update-check.json"
          gh api -X PATCH -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" --input "$RUNNER_TEMP/update-check.json" >/dev/null

          # The latest marker is advisory, terminal-only, and monotonic across stale retries.
          LATEST_HTTP_STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/current-latest-release.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/releases/latest")
          CURRENT_LATEST_VERSION=''
          if [[ "$LATEST_HTTP_STATUS" == 200 ]]; then
            CURRENT_LATEST_TAG=$(jq -er '.tag_name' "$RUNNER_TEMP/current-latest-release.json")
            [[ "$CURRENT_LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            CURRENT_LATEST_VERSION=${CURRENT_LATEST_TAG#v}
          elif [[ "$LATEST_HTTP_STATUS" != 404 ]]; then
            cat "$RUNNER_TEMP/current-latest-release.json" >&2
            exit 1
          fi
          jq -n --arg candidateVersion "$VERSION" --arg currentLatestVersion "$CURRENT_LATEST_VERSION" '
            {candidateVersion:$candidateVersion,
              currentLatestVersion:(if $currentLatestVersion == "" then null else $currentLatestVersion end)}
          ' > "$RUNNER_TEMP/latest-promotion-input.json"
          node tools/release/release-state.mjs latest-promotion \
            "$RUNNER_TEMP/latest-promotion-input.json" > "$RUNNER_TEMP/latest-promotion.json"
          if [[ "$(jq -er '.action' "$RUNNER_TEMP/latest-promotion.json")" == promote ]]; then
            gh release edit "$TAG" --repo "$REPOSITORY" --latest
          fi

  rollback-aliases:
    name: Roll back the durable alias plan after any later failure
    needs: [publish, advance-aliases, record-verification]
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.record-verification.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release-state-${{ github.repository }}-${{ needs.publish.outputs.sha }}
      cancel-in-progress: false
      queue: max
    permissions:
      checks: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          fetch-depth: 0
      - name: Restore every moved alias by reverse-order compare-and-swap
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INTENT_ID: ${{ needs.publish.outputs.intent-id }}
          SHA: ${{ needs.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          old_target() { git ls-remote --tags origin "refs/tags/$1" | awk '{print $1}'; }
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/check-runs/$INTENT_ID" > "$RUNNER_TEMP/intent-check.json"
          jq -er '.output.text | fromjson' "$RUNNER_TEMP/intent-check.json" \
            > "$RUNNER_TEMP/release-state.json"
          jq -e 'has("aliasPlan")' "$RUNNER_TEMP/release-state.json" >/dev/null || exit 0

          # A conflict discovered here must cause zero remote mutations, including evidence deletion.
          jq -c '.aliasPlan.aliases[]' "$RUNNER_TEMP/release-state.json" |
          while IFS= read -r ALIAS; do
            NAME=$(jq -er '.name' <<< "$ALIAS")
            TARGET=$(jq -er '.target' <<< "$ALIAS")
            PREVIOUS=$(jq -r '.previousTarget // ""' <<< "$ALIAS")
            CURRENT=$(old_target "$NAME")
            [[ "$CURRENT" == "$TARGET" || "$CURRENT" == "$PREVIOUS" ]]
          done

          ROLLBACK_TAG=$(jq -er '.intent.tag' "$RUNNER_TEMP/release-state.json")
          ROLLBACK_SHA=$(jq -er '.intent.mergeCommitSha' "$RUNNER_TEMP/release-state.json")
          ROLLBACK_RELEASE_ID=$(jq -er '.stagedDraft.releaseId' "$RUNNER_TEMP/release-state.json")
          [[ "$ROLLBACK_SHA" == "$SHA" ]]
          RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/releases/tags/$ROLLBACK_TAG")
          jq -e --argjson releaseId "$ROLLBACK_RELEASE_ID" --arg tag "$ROLLBACK_TAG" \
            '.id == $releaseId and .tag_name == $tag' <<< "$RELEASE_JSON" >/dev/null
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPOSITORY/git/ref/tags/$ROLLBACK_TAG" > "$RUNNER_TEMP/rollback-tag-ref.json"
          jq -e --arg ref "refs/tags/$ROLLBACK_TAG" --arg sha "$ROLLBACK_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
            "$RUNNER_TEMP/rollback-tag-ref.json" >/dev/null
          FINAL_COUNT=$(jq '[.assets[] | select(.name == "final-verification.json")] | length' \
            <<< "$RELEASE_JSON")
          jq '[.assets[] | select(.name == "final-verification.json") |
            {name:.name,assetId:.id,sha256:(.digest | sub("^sha256:"; ""))}]' \
            <<< "$RELEASE_JSON" > "$RUNNER_TEMP/rollback-final-assets.json"
          jq -n --slurpfile state "$RUNNER_TEMP/release-state.json" \
            --slurpfile assets "$RUNNER_TEMP/rollback-final-assets.json" \
            '{state:$state[0],assets:$assets[0]}' > "$RUNNER_TEMP/final-rollback-input.json"
          node tools/release/release-state.mjs final-rollback-decision \
            "$RUNNER_TEMP/final-rollback-input.json" > "$RUNNER_TEMP/final-rollback-decision.json"
          FINAL_ACTION=$(jq -er '.action' "$RUNNER_TEMP/final-rollback-decision.json")
          if [[ "$FINAL_ACTION" == delete ]]; then
            [[ "$FINAL_COUNT" == 1 ]]
            jq -e '.draft == false' <<< "$RELEASE_JSON" >/dev/null
            FINAL_ASSET_ID=$(jq -er '.assetId' "$RUNNER_TEMP/final-rollback-decision.json")
            FINAL_DIGEST=$(jq -er '.finalPlanned.finalVerificationDigest' \
              "$RUNNER_TEMP/release-state.json")
            [[ "$(jq -er '.sha256' "$RUNNER_TEMP/final-rollback-decision.json")" == "$FINAL_DIGEST" ]]
            [[ "$(jq -er --argjson id "$FINAL_ASSET_ID" '[.assets[] | select(.id == $id)][0].digest' \
              <<< "$RELEASE_JSON")" == "sha256:$FINAL_DIGEST" ]]
            mkdir -p "$RUNNER_TEMP/rollback-final"
            gh release download "$(jq -er '.intent.tag' "$RUNNER_TEMP/release-state.json")" \
              --repo "$REPOSITORY" --pattern final-verification.json \
              --dir "$RUNNER_TEMP/rollback-final"
            [[ "$(sha256sum "$RUNNER_TEMP/rollback-final/final-verification.json" | cut -d' ' -f1)" == "$FINAL_DIGEST" ]]
            gh api -X DELETE -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/releases/assets/$FINAL_ASSET_ID"
            RELEASE_JSON=$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/releases/tags/$ROLLBACK_TAG")
            jq -e --argjson releaseId "$ROLLBACK_RELEASE_ID" --arg tag "$ROLLBACK_TAG" \
              '.id == $releaseId and .tag_name == $tag' <<< "$RELEASE_JSON" >/dev/null
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/git/ref/tags/$ROLLBACK_TAG" > "$RUNNER_TEMP/rollback-tag-ref.json"
            jq -e --arg ref "refs/tags/$ROLLBACK_TAG" --arg sha "$ROLLBACK_SHA" \
              '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
              "$RUNNER_TEMP/rollback-tag-ref.json" >/dev/null
            jq -e --argjson id "$FINAL_ASSET_ID" '[.assets[] |
              select(.id == $id or .name == "final-verification.json")] | length == 0' \
              <<< "$RELEASE_JSON" >/dev/null
          elif [[ "$FINAL_ACTION" == retain ]]; then
            jq -c '.aliasPlan.aliases[]' "$RUNNER_TEMP/release-state.json" |
            while IFS= read -r ALIAS; do
              NAME=$(jq -er '.name' <<< "$ALIAS")
              TARGET=$(jq -er '.target' <<< "$ALIAS")
              [[ "$(old_target "$NAME")" == "$TARGET" ]]
            done
            exit 0
          else
            [[ "$FINAL_ACTION" == none ]]
          fi

          # Fail before the first write unless every alias is still at its durable previous or target.
          jq -c '.aliasPlan.aliases[]' "$RUNNER_TEMP/release-state.json" |
          while IFS= read -r ALIAS; do
            NAME=$(jq -er '.name' <<< "$ALIAS")
            TARGET=$(jq -er '.target' <<< "$ALIAS")
            PREVIOUS=$(jq -r '.previousTarget // ""' <<< "$ALIAS")
            CURRENT=$(old_target "$NAME")
            [[ "$CURRENT" == "$TARGET" || "$CURRENT" == "$PREVIOUS" ]]
          done

          jq -c '.aliasPlan.aliases | reverse[]' "$RUNNER_TEMP/release-state.json" |
          while IFS= read -r ALIAS; do
            NAME=$(jq -er '.name' <<< "$ALIAS")
            TARGET=$(jq -er '.target' <<< "$ALIAS")
            PREVIOUS=$(jq -r '.previousTarget // ""' <<< "$ALIAS")
            [[ "$TARGET" == "$SHA" ]]
            CURRENT=$(old_target "$NAME")
            if [[ -z "$PREVIOUS" && -z "$CURRENT" ]]; then
              continue
            fi
            if [[ -n "$PREVIOUS" && "$CURRENT" == "$PREVIOUS" ]]; then
              continue
            fi
            jq -n --arg current "$CURRENT" --arg candidate "$TARGET" --arg previous "$PREVIOUS" '
              {current:$current,candidate:$candidate,
                previous:(if $previous == "" then null else $previous end)}
            ' > "$RUNNER_TEMP/rollback-decision-input.json"
            node tools/release/release-state.mjs alias-rollback \
              "$RUNNER_TEMP/rollback-decision-input.json" \
              > "$RUNNER_TEMP/rollback-decision.json"
            ACTION=$(jq -er '.action' "$RUNNER_TEMP/rollback-decision.json")
            if [[ "$ACTION" == restore ]]; then
              git push origin "$PREVIOUS:refs/tags/$NAME" \
                --force-with-lease="refs/tags/$NAME:$TARGET"
            elif [[ "$ACTION" == delete ]]; then
              git push origin ":refs/tags/$NAME" \
                --force-with-lease="refs/tags/$NAME:$TARGET"
            else
              exit 1
            fi
          done

          jq -c '.aliasPlan.aliases[]' "$RUNNER_TEMP/release-state.json" |
          while IFS= read -r ALIAS; do
            NAME=$(jq -er '.name' <<< "$ALIAS")
            PREVIOUS=$(jq -r '.previousTarget // ""' <<< "$ALIAS")
            [[ "$(old_target "$NAME")" == "$PREVIOUS" ]]
          done
