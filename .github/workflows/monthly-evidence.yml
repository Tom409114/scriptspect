name: Monthly evidence draft

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  collect:
    name: Collect unreviewed public evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the locked collector toolchain
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Collect the unreviewed draft
        shell: bash
        run: >-
          pnpm exec tsx tools/collect-monthly-evidence.ts
          --repository "$GITHUB_REPOSITORY"
          --package scriptspect
          --json evidence/monthly-evidence-draft.json
          --markdown evidence/monthly-evidence-draft.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload the draft for maintainer review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monthly-evidence-draft-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
