name: Corpus scan (read-only)

on:
  workflow_dispatch:
    inputs:
      repo-count:
        description: How many popular JS/TS repositories to sample
        required: false
        default: '100'
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Collect repository candidates
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_FILE: ${{ runner.temp }}/repository-candidates.txt
        run: |
          set -euo pipefail
          gh api 'search/repositories?q=language:typescript+stars:%3E2000&sort=stars&order=desc&per_page=100' \
            --jq '.items[].full_name' > "$CANDIDATE_FILE"
          gh api 'search/repositories?q=language:javascript+stars:%3E5000&sort=stars&order=desc&per_page=100' \
            --jq '.items[].full_name' >> "$CANDIDATE_FILE"
      - name: Prepare the deterministic repository candidate pool
        env:
          REPO_COUNT: ${{ inputs.repo-count || '100' }}
          CANDIDATE_FILE: ${{ runner.temp }}/repository-candidates.txt
          SELECTED_FILE: ${{ runner.temp }}/repository-candidate-pool.txt
        run: |
          set -euo pipefail
          [[ "$REPO_COUNT" =~ ^([1-9]|[1-9][0-9]|100)$ ]]
          [[ "$REPO_COUNT" -le 100 ]]
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const countText = process.env.REPO_COUNT ?? '';
          if (!/^(?:[1-9]|[1-9][0-9]|100)$/u.test(countText)) {
            throw new Error('REPO_COUNT must be an integer from 1 through 100');
          }
          const requested = Number(countText);
          const candidateFile = process.env.CANDIDATE_FILE;
          const selectedFile = process.env.SELECTED_FILE;
          if (!candidateFile || !selectedFile) {
            throw new Error('corpus selection file paths are required');
          }

          const candidates = readFileSync(candidateFile, 'utf8')
            .split(/\r?\n/u)
            .filter(Boolean);
          for (const repository of candidates) {
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/u.test(repository)) {
              throw new Error(`invalid repository name: ${repository}`);
            }
          }
          const uniqueCandidates = [...new Set(candidates)].sort();
          if (uniqueCandidates.length < requested) {
            throw new Error(
              `requested ${requested} repositories but only ${uniqueCandidates.length} unique candidates were returned`,
            );
          }
          writeFileSync(selectedFile, `${uniqueCandidates.join('\n')}\n`, 'utf8');
          NODE
      - name: Resolve the exact root-eligible repository sample
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_COUNT: ${{ inputs.repo-count || '100' }}
          CANDIDATE_FILE: ${{ runner.temp }}/repository-candidate-pool.txt
        run: pnpm exec tsx tools/corpus-resolve.ts "$CANDIDATE_FILE" repos.txt repository-sample.json "$REPO_COUNT"
      - name: Scan scripts without writing to sampled repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPTSPECT_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm exec tsx tools/corpus-scan.ts repos.txt
      - name: Create a deterministic 100-finding adjudication draft when available
        if: always()
        run: |
          set -euo pipefail
          test -f findings.jsonl || exit 0
          FINDING_COUNT=$(wc -l < findings.jsonl)
          if [[ "$FINDING_COUNT" -ge 100 ]]; then
            pnpm exec tsx tools/corpus-sample.ts \
              findings.jsonl adjudication-draft.jsonl 100 "$GITHUB_SHA"
          fi
      - name: Upload draft evidence for maintainer review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-draft-${{ github.run_id }}
          path: |
            repos.txt
            repository-sample.json
            findings.jsonl
            summary.md
            corpus-run.json
            adjudication-draft.jsonl
          retention-days: 30
          if-no-files-found: error
