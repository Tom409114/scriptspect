name: Corpus scan (read-only)

on:
  workflow_dispatch:
    inputs:
      repo-count:
        description: How many popular JS/TS repositories to sample
        required: false
        default: '100'
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Collect the ranked repository candidate snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec tsx tools/corpus-candidates.ts repository-candidates.json
      - name: Resolve the exact root-eligible repository sample
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_COUNT: ${{ inputs.repo-count || '100' }}
        run: pnpm exec tsx tools/corpus-resolve.ts repository-candidates.json repos.txt repository-sample.json "$REPO_COUNT"
      - name: Scan scripts without writing to sampled repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCRIPTSPECT_SOURCE_COMMIT: ${{ github.sha }}
          CORPUS_SAMPLE_METHOD: popularity-strata-round-robin-v1
          CORPUS_CANDIDATE_SNAPSHOT: repository-candidates.json
          CORPUS_SAMPLE_EVIDENCE: repository-sample.json
        run: pnpm exec tsx tools/corpus-scan.ts repos.txt
      - name: Create a deterministic 100-finding adjudication draft when available
        if: always()
        run: |
          set -euo pipefail
          test -f findings.jsonl || exit 0
          FINDING_COUNT=$(wc -l < findings.jsonl)
          if [[ "$FINDING_COUNT" -ge 100 ]]; then
            pnpm exec tsx tools/corpus-sample.ts \
              findings.jsonl adjudication-draft.jsonl 100 "$GITHUB_SHA"
          fi
      - name: Upload draft evidence for maintainer review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-draft-${{ github.run_id }}
          path: |
            repository-candidates.json
            repos.txt
            repository-sample.json
            findings.jsonl
            summary.md
            corpus-run.json
            adjudication-draft.jsonl
          retention-days: 30
          if-no-files-found: error
