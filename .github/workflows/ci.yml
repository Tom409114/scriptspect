name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lockfile-consistency:
    name: Lockfile consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Activate the packageManager-pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm --version
      - name: Prove manifest and lockfile coherence without rewriting either
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- package.json pnpm-lock.yaml

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Regenerate schemas, rule docs, and bilingual demo assets
        env:
          SOURCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          pnpm exec tsx tools/generate-schemas.ts
          pnpm docs:rules
          pnpm exec tsx tools/generate-readme-demo.ts
          pnpm exec tsx tools/check-readme-parity.ts
          STATUS_COMMIT=$(node -e "const fs=require('node:fs'); const status=JSON.parse(fs.readFileSync('docs/readme-status.json')); if(!/^[0-9a-f]{40}$/.test(status.sourceCommit)) process.exit(1); process.stdout.write(status.sourceCommit)")
          git cat-file -e "$STATUS_COMMIT^{commit}"
          git merge-base --is-ancestor "$STATUS_COMMIT" HEAD
          test "$STATUS_COMMIT" != "$(git rev-parse HEAD)"
          git cat-file -e "$SOURCE_BASE^{commit}"
          set +e
          git diff --quiet "$SOURCE_BASE" HEAD -- \
            docs/readme-status.json \
            docs/validation/readme-action-evidence.json \
            README.md \
            README.zh-CN.md
          SOURCE_DIFF=$?
          set -e
          case "$SOURCE_DIFF" in
            0)
              PINNED_SOURCE_DIR="$RUNNER_TEMP/readme-pinned-source"
              mkdir -p "$PINNED_SOURCE_DIR"
              git archive "$STATUS_COMMIT" | tar -x -C "$PINNED_SOURCE_DIR"
              (
                cd "$PINNED_SOURCE_DIR"
                corepack pnpm install --frozen-lockfile
                corepack pnpm exec tsx tools/generate-readme-demo.ts
              )
              for PINNED_ASSET in \
                package.before.json \
                terminal.txt \
                fix.patch \
                package.after.json \
                terminal.svg; do
                git diff --no-index --exit-code -- \
                  "$PINNED_SOURCE_DIR/docs/assets/demo/$PINNED_ASSET" \
                  "docs/assets/demo/$PINNED_ASSET"
              done
              ;;
            1)
              git diff --quiet "$STATUS_COMMIT" HEAD -- \
                src dist schema package.json pnpm-lock.yaml pnpm-workspace.yaml action.yml tsconfig.json tsup.config.ts
              ;;
            *)
              echo "::error::unable to compare README source metadata with the event base"
              exit "$SOURCE_DIFF"
              ;;
          esac
          git diff --exit-code -- \
            schema \
            docs/rules \
            docs/assets/demo \
            docs/readme-status.json \
            README.md \
            README.zh-CN.md

  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec biome check --error-on-warnings .
      - run: pnpm build
      - name: Unit and integration tests with the v0.1 coverage floor
        run: >-
          pnpm exec vitest run --coverage
          --coverage.include='src/parser/**'
          --coverage.include='src/rules/**'
          --coverage.thresholds.lines=90
          --coverage.thresholds.statements=90
          --coverage.thresholds.functions=90
          --coverage.thresholds.branches=90

  integration:
    name: Integration (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install from the committed lockfile
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm test
      - name: CLI smoke test
        run: node dist/cli.mjs --version

  package:
    name: Packed consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Pack once and inspect the public file set
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          TARBALL=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name 'scriptspect-*.tgz' -print -quit)
          test -f "$TARBALL"
          tar -tzf "$TARBALL" | sort > "$RUNNER_TEMP/pack-files.txt"
          grep -Fx 'package/schema/config.schema.json' "$RUNNER_TEMP/pack-files.txt"
          grep -Fx 'package/schema/output.schema.json' "$RUNNER_TEMP/pack-files.txt"
          grep -Fx 'package/dist/action.mjs' "$RUNNER_TEMP/pack-files.txt"
      - name: Install the tarball into a fresh consumer
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/pack/scriptspect-*.tgz --ignore-scripts
          ./node_modules/.bin/scriptspect --version

  action-consumer:
    name: Bundled Action consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Rebuild and prove the committed Action bundle is current
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          git diff --exit-code -- dist/action.mjs dist/action.mjs.map
      - name: Create controlled clean and broken consumers
        run: |
          mkdir -p .ci/action-clean .ci/action-broken
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const fixtures = [
            ['.ci/action-clean/package.json', { name: 'clean', scripts: { build: 'node -e "process.exit(0)"' } }],
            ['.ci/action-broken/package.json', { name: 'broken', scripts: { clean: 'rm -rf dist' } }],
          ];
          for (const [path, manifest] of fixtures) {
            writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8');
          }
          NODE
          sha256sum .ci/action-clean/package.json .ci/action-broken/package.json > "$RUNNER_TEMP/action-fixtures.sha256"
      - name: Analyze the broken fixture
        id: broken
        uses: ./
        continue-on-error: true
        with:
          path: .ci/action-broken
      - name: Analyze the clean fixture
        id: clean
        uses: ./
        with:
          path: .ci/action-clean
      - name: Assert outcomes, numeric outputs, and read-only behavior
        if: always()
        env:
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_EXIT: ${{ steps.broken.outputs.exit-code }}
          BROKEN_ERRORS: ${{ steps.broken.outputs.errors }}
          BROKEN_WARNINGS: ${{ steps.broken.outputs.warnings }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          CLEAN_EXIT: ${{ steps.clean.outputs.exit-code }}
        run: |
          test "$BROKEN_OUTCOME" = failure
          test "$BROKEN_EXIT" = 1
          [[ "$BROKEN_ERRORS" =~ ^[0-9]+$ ]]
          [[ "$BROKEN_WARNINGS" =~ ^[0-9]+$ ]]
          test "$CLEAN_OUTCOME" = success
          test "$CLEAN_EXIT" = 0
          sha256sum --check "$RUNNER_TEMP/action-fixtures.sha256"
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE/.ci/action-clean" \
            GITHUB_STEP_SUMMARY="$RUNNER_TEMP/action-summary.md" \
            GITHUB_OUTPUT="$RUNNER_TEMP/action-summary-output.txt" \
            INPUT_PATH=. \
            node dist/action.mjs
          grep -Fx '## scriptspect' "$RUNNER_TEMP/action-summary.md"
          grep -F 'Scanned **1 script** across **1 package**.' "$RUNNER_TEMP/action-summary.md"
          grep -Fx 'exit-code=0' "$RUNNER_TEMP/action-summary-output.txt"
      - name: Upload hosted Action summary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-consumer-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/action-summary.md
            ${{ runner.temp }}/action-summary-output.txt
          retention-days: 30
          if-no-files-found: error

  action-evidence:
    name: Hosted Action annotations and summary evidence
    needs: [action-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Query the completed hosted check and annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/action-consumer-evidence"
          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name "action-consumer-evidence-$RUN_ID" \
            --dir "$RUNNER_TEMP/action-consumer-evidence"
          SUMMARY_FILE="$RUNNER_TEMP/action-consumer-evidence/action-summary.md"
          OUTPUT_FILE="$RUNNER_TEMP/action-consumer-evidence/action-summary-output.txt"
          grep -Fx '## scriptspect' "$SUMMARY_FILE"
          grep -F 'Scanned **1 script** across **1 package**.' "$SUMMARY_FILE"
          grep -Fx 'exit-code=0' "$OUTPUT_FILE"
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/jobs-pages.json"
          jq -s '{jobs: map(.jobs[]) }' "$RUNNER_TEMP/jobs-pages.json" > "$RUNNER_TEMP/jobs.json"
          JOB_ID=$(jq -er '[.jobs[] | select(.name == "Bundled Action consumer")] | if length == 1 then .[0].id else error("job cardinality") end' "$RUNNER_TEMP/jobs.json")
          CHECK_RUN_URL=$(jq -er --argjson job "$JOB_ID" '.jobs[] | select(.id == $job) | .check_run_url' "$RUNNER_TEMP/jobs.json")
          CHECK_RUN_ID=${CHECK_RUN_URL##*/}
          [[ "$CHECK_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api --paginate "repos/$REPOSITORY/check-runs/$CHECK_RUN_ID/annotations?per_page=100" > "$RUNNER_TEMP/annotation-pages.json"
          jq -s 'add' "$RUNNER_TEMP/annotation-pages.json" > "$RUNNER_TEMP/annotations.json"
          jq -e 'length > 0 and any(.[]; ((.title // "") + " " + (.message // "")) | test("PS[0-9]{3}|scriptspect"))' "$RUNNER_TEMP/annotations.json" >/dev/null
          jq -n \
            --argjson workflowRunId "$RUN_ID" \
            --argjson jobId "$JOB_ID" \
            --argjson checkRunId "$CHECK_RUN_ID" \
            --argjson annotationCount "$(jq 'length' "$RUNNER_TEMP/annotations.json")" \
            --arg summarySha256 "$(sha256sum "$SUMMARY_FILE" | cut -d' ' -f1)" \
            '{workflowRunId: $workflowRunId, jobId: $jobId, checkRunId: $checkRunId, annotationCount: $annotationCount, summarySha256: $summarySha256}' \
            > "$RUNNER_TEMP/action-runner-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-runner-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/action-runner-evidence.json
          retention-days: 30
          if-no-files-found: error

  dependency-policy:
    name: Runtime dependency budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Keep runtime direct dependencies below 10
        run: node -e "const p=require('./package.json'); const count=Object.keys(p.dependencies||{}).length; if(!(count < 10)) throw new Error('runtime dependencies must remain < 10')"

  workspace-benchmark:
    name: Hosted 100-package workspace benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Record the exact hosted benchmark evidence
        env:
          SCRIPTSPECT_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm exec tsx tools/benchmark-workspace.ts "$RUNNER_TEMP/workspace-benchmark.json" 100 2000
      - name: Upload hosted benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-benchmark.json
          retention-days: 30
          if-no-files-found: error

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
