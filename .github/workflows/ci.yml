name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile (bootstrap)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - name: Sync lockfile with package.json
        run: |
          pnpm install --lockfile-only
          git config user.name "scriptspect-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "lockfile up to date"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml"
          git push

  format:
    name: Canonicalize formatting (biome)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - name: Apply biome canonical formatting and push if needed
        run: |
          pnpm exec biome check --write .
          git checkout -- pnpm-lock.yaml 2>/dev/null || true
          git config user.name "scriptspect-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "already canonically formatted"
            exit 0
          fi
          git add -u
          git commit -m "style: canonical biome formatting"
          git push

  docs:
    name: Rule docs (generated)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - name: Regenerate rule docs and push if needed
        run: |
          pnpm docs:rules
          git checkout -- pnpm-lock.yaml 2>/dev/null || true
          git config user.name "scriptspect-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/rules; then
            echo "rule docs up to date"
            exit 0
          fi
          git add docs/rules
          git commit -m "docs: regenerate rule docs from metadata"
          git push

  quality:
    name: Quality (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    name: Integration (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: node dist/cli.mjs --version

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - name: Install packed tarball and run CLI
        run: |
          mkdir -p /tmp/pkg-smoke
          cd /tmp/pkg-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/scriptspect-*.tgz
          npx scriptspect --version

  security:
    name: Security (CodeQL, dependency review)
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
