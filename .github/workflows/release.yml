name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # First release is v0.1.0 (docs/roadmap, README support matrix), not
          # release-please's 1.0.0 default for an untagged 0.0.0 baseline.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm (trusted publishing)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Publish with provenance (requires npm trusted publishing configuration)
        run: npm publish --provenance --access public

  # M7 (spec §13.1 / §23): the GitHub Release carries a reproducible
  # tarball plus a SHA-256 checksum manifest, and the bytes npm published are
  # verified byte-for-byte (by content) against the tarball built in CI.
  checksums:
    name: Release checksums and assets (SHA-256)
    needs: [release-please, publish-npm]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g pnpm@11.24.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Pack the release tarball
        id: pack
        run: |
          TARBALL=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          # pnpm prints the tarball's absolute path; keep only the filename so
          # later steps can prefix it with "$RUNNER_TEMP/" exactly once.
          TARBALL=$(basename "$TARBALL")
          test -n "$TARBALL" || { echo "::error::pnpm pack produced no tarball name" >&2; exit 1; }
          test -f "$RUNNER_TEMP/$TARBALL" || { echo "::error::$TARBALL not found in RUNNER_TEMP" >&2; exit 1; }
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"
      - name: Smoke-test the packed artifact
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          tar -xzf "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}" -C "$RUNNER_TEMP/verify"
          node "$RUNNER_TEMP/verify/package/dist/cli.mjs" --version
          node "$RUNNER_TEMP/verify/package/dist/cli.mjs" --help >/dev/null
      - name: Generate SHA256SUMS
        run: |
          cd "$RUNNER_TEMP"
          test -f "${{ steps.pack.outputs.tarball }}" || { echo "::error::tarball missing in RUNNER_TEMP" >&2; exit 1; }
          sha256sum "${{ steps.pack.outputs.tarball }}" | tee SHA256SUMS
      - name: Verify the published npm tarball matches the local pack
        run: |
          cd "$RUNNER_TEMP"
          # tag_name may carry a component prefix (e.g. scriptspect-v0.1.0);
          # use the plain semver from release-please for the npm URL.
          VERSION="${{ needs.release-please.outputs.version }}"
          test -n "$VERSION" || { echo "::error::release-please version output is empty" >&2; exit 1; }
          # The registry can lag the publish by a few seconds; retry transient failures.
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors -o published.tgz \
            "https://registry.npmjs.org/scriptspect/-/scriptspect-${VERSION}.tgz"
          mkdir -p local npm
          tar -xzf "${{ steps.pack.outputs.tarball }}" -C local
          tar -xzf published.tgz -C npm
          # File-set parity (no missing/extra files between CI pack and npm).
          ( cd local/package && find . -type f | sort ) > local-files.txt
          ( cd npm/package && find . -type f | sort ) > npm-files.txt
          if ! diff -u local-files.txt npm-files.txt; then
            echo "::error::published npm tarball file set differs from the CI-built tarball" >&2
            exit 1
          fi
          # Content digest of every published file except package.json: npm
          # normalizes the manifest on publish (e.g. repository string -> object),
          # so it is covered by file-set parity but excluded from the digest.
          digest() { ( cd "$1" && find . -type f ! -name package.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 ); }
          LOCAL=$(digest local/package)
          NPM=$(digest npm/package)
          echo "local  sha256: $LOCAL"
          echo "npm    sha256: $NPM"
          test "$LOCAL" = "$NPM" || { echo "::error::published tarball content differs from CI build" >&2; exit 1; }
      - name: Upload tarball and checksums to the release
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "$RUNNER_TEMP/${{ steps.pack.outputs.tarball }}" \
            "$RUNNER_TEMP/SHA256SUMS" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
