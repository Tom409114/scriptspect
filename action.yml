name: 'scriptspect'
description: >-
  Cross-platform static analysis for package.json scripts — catches
  shell-specific commands before they break Windows, macOS, or Linux builds.
author: 'Tom409114'

branding:
  icon: 'search'
  color: 'blue'

inputs:
  path:
    description: 'Project path to analyze (defaults to the repository root).'
    required: false
    default: '.'
  target:
    description: >-
      Target shells, comma-separated: posix-sh, cmd, powershell. Omit to honor
      the project's scriptspect.config.json (CLI default: posix-sh,cmd).
    required: false
    default: ''
  severity:
    description: >-
      Minimum severity to display: error, warn, or advisory. Omit to display
      every configured finding (CLI default: advisory).
    required: false
    default: ''
  max-warnings:
    description: 'Fail the job when warnings exceed this number (omit for unlimited).'
    required: false
    default: ''

outputs:
  exit-code:
    description: 'Analyzer exit code (0, 1, or 2).'
  packages:
    description: 'Number of packages scanned.'
  scripts:
    description: 'Number of scripts scanned.'
  errors:
    description: 'Number of reported errors.'
  warnings:
    description: 'Number of reported warnings.'
  advisories:
    description: 'Number of reported advisories.'

runs:
  using: 'node24'
  main: 'dist/action.mjs'
