  <text x="28" y="624" class="terminal-line"> </text>
  <text x="28" y="646" class="terminal-line">PS010  error  HIGH  `rm -rf` is not available in native Windows npm scripts</text>
  <text x="28" y="668" class="terminal-line">       rm -rf dist</text>
  <text x="28" y="690" class="terminal-line">       ^^</text>
  <text x="28" y="712" class="terminal-line">       Affected: cmd</text>
