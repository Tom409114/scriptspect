  <text x="28" y="52" class="terminal-line">$ node dist/cli.mjs .</text>
  <text x="28" y="74" class="terminal-line"> </text>
  <text x="28" y="96" class="terminal-line">package.json  ›  scripts.build</text>
  <text x="28" y="118" class="terminal-line"> </text>
  <text x="28" y="140" class="terminal-line">PS001  error  HIGH  POSIX inline env assignment `NODE_ENV=production` is not portable to non-POSIX target shells</text>
  <text x="28" y="162" class="terminal-line">       NODE_ENV=production vite build</text>
  <text x="28" y="184" class="terminal-line">       ^^^^^^^^^^^^^^^^^^^</text>
  <text x="28" y="206" class="terminal-line">       Affected: cmd</text>
  <text x="28" y="228" class="terminal-line">       Fix: rewrite as `NODE_ENV=production …` under cross-env (cross-env is already a dependency)</text>
  <text x="28" y="250" class="terminal-line">       Learn more: https://github.com/Tom409114/scriptspect/blob/main/docs/rules/PS001.md</text>
  <text x="28" y="272" class="terminal-line"> </text>
  <text x="28" y="294" class="terminal-line">PS050  advisory  MEDIUM  Target parses assign different structural roles to `NODE_ENV=production` (posix-sh: leading env; cmd: executable)</text>
  <text x="28" y="316" class="terminal-line">       NODE_ENV=production vite build</text>
  <text x="28" y="338" class="terminal-line">       ^^^^^^^^^^^^^^^^^^^</text>
  <text x="28" y="360" class="terminal-line">       Affected: posix-sh, cmd</text>
  <text x="28" y="382" class="terminal-line">       Fix: rewrite with syntax that has the same command graph on every target</text>
  <text x="28" y="404" class="terminal-line">       Learn more: https://github.com/Tom409114/scriptspect/blob/main/docs/rules/PS050.md</text>
  <text x="28" y="426" class="terminal-line"> </text>
  <text x="28" y="448" class="terminal-line">PS050  advisory  MEDIUM  Target parses assign different structural roles to `vite` (posix-sh: executable; cmd: argument)</text>
  <text x="28" y="470" class="terminal-line">       NODE_ENV=production vite build</text>
  <text x="28" y="492" class="terminal-line">                           ^^^^</text>
  <text x="28" y="514" class="terminal-line">       Affected: posix-sh, cmd</text>
  <text x="28" y="536" class="terminal-line">       Fix: rewrite with syntax that has the same command graph on every target</text>
  <text x="28" y="558" class="terminal-line">       Learn more: https://github.com/Tom409114/scriptspect/blob/main/docs/rules/PS050.md</text>
  <text x="28" y="580" class="terminal-line"> </text>
