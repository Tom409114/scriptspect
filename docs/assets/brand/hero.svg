<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ScriptSpect — portable package scripts, checked before they ship</title>
  <desc id="desc">A dark banner showing package scripts analyzed across POSIX shell, Windows cmd, and PowerShell targets.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1d"/>
      <stop offset="0.55" stop-color="#111936"/>
      <stop offset="1" stop-color="#091923"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb4d8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="895" cy="132" r="310" fill="url(#glow)"/>
  <path d="M0 318C235 252 397 352 614 300S959 222 1200 292V360H0Z" fill="#38bdf8" opacity="0.035"/>

  <g transform="translate(72 62)">
    <g aria-hidden="true">
      <rect width="72" height="72" rx="19" fill="#111b38" stroke="#6475a3" stroke-opacity="0.48"/>
      <path d="M19 21h19c9 0 15 5 15 12 0 8-6 12-15 12H29c-7 0-11 4-11 10 0 7 6 11 15 11h20" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
      <circle cx="54" cy="21" r="5" fill="#38bdf8"/>
      <circle cx="18" cy="66" r="5" fill="#34d399"/>
    </g>
    <text x="94" y="40" fill="#f8fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="760" letter-spacing="-1.6">ScriptSpect</text>
    <rect x="94" y="55" width="330" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="125" fill="#d7e2f4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="560">Portable package scripts, checked before they ship.</text>
    <text x="0" y="162" fill="#91a4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Static analysis · target-aware findings · reviewable fixes</text>
    <g transform="translate(0 190)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="650">
      <rect width="108" height="34" rx="17" fill="#231d4b" stroke="#8b5cf6" stroke-opacity="0.65"/>
      <text x="19" y="22" fill="#c4b5fd">posix-sh</text>
      <rect x="120" width="74" height="34" rx="17" fill="#123047" stroke="#38bdf8" stroke-opacity="0.65"/>
      <text x="141" y="22" fill="#7dd3fc">cmd</text>
      <rect x="206" width="120" height="34" rx="17" fill="#10372f" stroke="#34d399" stroke-opacity="0.65"/>
      <text x="224" y="22" fill="#6ee7b7">powershell</text>
    </g>
  </g>

  <g transform="translate(706 63)" filter="url(#shadow)">
    <rect width="422" height="235" rx="16" fill="#0b1020" stroke="#8292bd" stroke-opacity="0.28"/>
    <rect width="422" height="38" rx="16" fill="#151d33"/>
    <rect y="25" width="422" height="13" fill="#151d33"/>
    <circle cx="22" cy="19" r="5" fill="#fb7185"/>
    <circle cx="40" cy="19" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="19" r="5" fill="#34d399"/>
    <text x="84" y="24" fill="#8495b5" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">package.json / scripts</text>
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">
      <text x="24" y="72" fill="#8fa3c7">"build":</text>
      <text x="101" y="72" fill="#f3f6fb">"NODE_ENV=production vite build"</text>
      <path d="M102 81h75" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <text x="286" y="100" fill="#c4b5fd">PS001 → cmd</text>

      <text x="24" y="132" fill="#8fa3c7">"clean":</text>
      <text x="101" y="132" fill="#f3f6fb">"rm -rf dist"</text>
      <path d="M102 141h20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="286" y="160" fill="#7dd3fc">PS010 → cmd</text>

      <rect x="22" y="180" width="378" height="34" rx="8" fill="#102a28" stroke="#34d399" stroke-opacity="0.35"/>
      <path d="M39 196l6 6 11-13" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="202" fill="#a7f3d0">analyzed — never executed</text>
    </g>
  </g>
</svg>
